name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant; do not pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 3.11 to match the Docker image, which is pinned there because Essentia's
      # wheels are. Keeping CI on the same minor version means a passing run
      # actually says something about what gets deployed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Not the [audio] extra: Essentia is imported lazily and never touched by the
      # suite, so installing it here would add minutes and prove nothing.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Catches what the tests cannot: the vitest/vite version clash that broke this
      # build once was a type error, not a failing assertion.
      - name: Typecheck
        run: npx tsc -b

      - name: Tests
        run: npm test

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `latest`. Resolving "latest" costs an unauthenticated
      # GitHub API call, and both jobs that need the CLI make it at the same time —
      # which rate-limited and failed this job while the browser job got through.
      # A pin also means a CLI release cannot change what CI does overnight.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # The slow job (it pulls the local stack), and the one that earns its keep.
      # The RLS policies once shipped without table GRANTs, which every unit test
      # passed straight through — only applying the SQL to a real Postgres caught
      # it. `db reset` replays every migration from scratch, in order.
      - name: Start local stack
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset

      - name: Stop
        if: always()
        run: supabase stop

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Same pin as the migrations job — see the note there.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local stack
        run: supabase start

      # Keys are generated per stack, so they are read back rather than hardcoded —
      # the demo values have changed between CLI versions before.
      #
      # Captured to a file first, and `|| true`, because this runner's bash has
      # pipefail on and `supabase status` can exit non-zero while still printing
      # perfectly good output. Piping it straight into grep would fail the step on
      # the CLI's exit code rather than on anything being wrong.
      - name: Collect stack credentials
        run: |
          supabase status -o env > "$RUNNER_TEMP/stack.env" || true
          sed -n 's/"//g;
                  s/^API_URL=/SUPABASE_URL=/p;
                  s/^ANON_KEY=/SUPABASE_ANON_KEY=/p;
                  s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' \
              "$RUNNER_TEMP/stack.env" >> "$GITHUB_ENV"
          # Fails the step now if extraction found nothing, rather than leaving the
          # backend to die of a missing setting three steps later.
          grep -c '^SUPABASE_' "$GITHUB_ENV"

      # Not the [audio] extra. These tests seed feature rows rather than running
      # extraction, so Essentia is never imported — which is what keeps this job at
      # a pip install instead of a 1 GB image build.
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Start backend
        working-directory: backend
        env:
          CORS_ORIGINS: http://localhost:4173
          ENVIRONMENT: development
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The production bundle, not the dev server: this is the only place in CI that
      # runs `vite build`, so a build-only failure has somewhere to surface.
      - name: Build and serve frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          VITE_API_URL: http://localhost:8000
        run: |
          npm run build
          npx vite preview --port 4173 &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:4173 && break
            sleep 1
          done

      - name: Browser tests
        working-directory: frontend
        env:
          XFADE_APP_URL: http://localhost:4173
          XFADE_API_URL: http://localhost:8000
        run: npm run test:e2e

      # The trace is the whole point of having one on failure; without this it stays
      # inside the runner and the run is only as useful as its console output.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

      - name: Stop
        if: always()
        run: supabase stop
