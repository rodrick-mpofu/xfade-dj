[project]
name = "xfade"
version = "0.1.0"
description = "Xfade — ML-forward DJ combo & transition logger (FastAPI backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "supabase>=2.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]
# Linux only — Essentia ships no Windows wheels. Installed in the Docker image,
# not in a host venv. numpy is pinned below 2.0 because Essentia's wheels are
# built against the 1.x ABI.
#
# Every published Essentia build is a pre-release, so the version is pinned
# exactly: naming it explicitly lets pip resolve it WITHOUT a global --pre, which
# would otherwise drag in alpha builds of fastapi, pydantic, and supabase and
# leave the container running a different stack than the host.
audio = [
    "essentia==2.1b6.dev1389",
    "numpy<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
