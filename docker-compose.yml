services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Source is bind-mounted so --reload picks up edits made on the host.
      # Only app/ — the host .venv is Windows-built and must not shadow the
      # container's site-packages.
      - ./backend/app:/srv/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
